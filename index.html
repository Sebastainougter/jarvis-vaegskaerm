  const m = w.toLowerCase().match(/[aeiouyæøåéäöü]+/g);

    if (/[,;:]$/.test(w)) pause = 0.28 / rate;
    if (/[.!?]$/.test(w)) pause = 0.5 / rate;

    g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.18 + 0.9);
    o.connect(g).connect(actx.destination); o.start(t + i * 0.18); o.stop(t + i * 0.18 + 1);
  });
}

// ---- wake lock ----
let lock = null;
async function wake() {
  try {
    if ("wakeLock" in navigator) {
      lock = await navigator.wakeLock.request("screen");
      wlEl.textContent = "SKÆRM HOLDES TÆNDT";
      lock.addEventListener("release", () => { wlEl.textContent = ""; });
    } else wlEl.textContent = "SLÅ AUTO-LÅS FRA PÅ ENHEDEN";
  } catch (e) { wlEl.textContent = "SLÅ AUTO-LÅS FRA PÅ ENHEDEN"; }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { wake(); poll(); } });

// ---- audio unlock: full overlay first time, small hint after a hard reload ----
const RESUME_KEY = "vaegskaerm_resume";
let unlocked = false, resumed = false;
try { resumed = sessionStorage.getItem(RESUME_KEY) === "1"; sessionStorage.removeItem(RESUME_KEY); } catch (e) {}
const overlay = document.getElementById("unlock");
const hint = document.createElement("button");
hint.id = "hint"; hint.textContent = "🔇 Tryk for lyd";
hint.style.cssText = "position:absolute;z-index:4;left:50%;transform:translateX(-50%);top:calc(34px + env(safe-area-inset-top));display:none;background:rgba(0,40,60,.7);color:#dffcff;border:1px solid rgba(0,229,255,.5);border-radius:6px;padding:6px 12px;font:600 12px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;cursor:pointer";
document.getElementById("stage").appendChild(hint);
function ensureAudio() {
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state !== "running") actx.resume(); } catch (e) { actx = null; }
}
function unlockAudio(fromGesture) {
  ensureAudio();
  if (fromGesture) { try { if (window.speechSynthesis) { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {} }
  audioOn = !params.has("mute");
  unlocked = true;
  wake();
}
function updateHint() { hint.style.display = (unlocked && actx && actx.state === "running") ? "none" : (resumed ? "" : "none"); }
overlay.addEventListener("click", () => {
  unlockAudio(true);
  const el = document.documentElement;
  try { if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {}); } catch (e) {}
  overlay.remove();
  pump();
});
if (resumed) {
  // hard reload happened after a previous unlock: no blocking overlay, try to resume silently
  overlay.remove();
  unlockAudio(false);
  setTimeout(updateHint, 800);
  const onAny = () => { unlockAudio(true); setTimeout(updateHint, 300); if (actx && actx.state === "running") { document.removeEventListener("pointerdown", onAny, true); } };
  document.addEventListener("pointerdown", onAny, true);
}
hint.addEventListener("click", (e) => { e.stopPropagation(); unlockAudio(true); setTimeout(updateHint, 300); });

// ---- alerts ----
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || "[]")); } catch (e) {}
const firstRun = seen.size === 0;
function saveSeen() { try { localStorage.setItem(SEEN_KEY, JSON.stringify(Array.from(seen).slice(-500))); } catch (e) {} }
const keyOf = (a) => (a.tidspunkt || "") + "|" + (a.tekst || "");
const queue = [];
let busy = false;
function pump() {
  if (busy || !queue.length || (!unlocked && document.getElementById("unlock"))) return;
  queue.sort((a, b) => (b.hi ? 1 : 0) - (a.hi ? 1 : 0));
  const a = queue.shift();
  busy = true;
  chime(a.hi);
  const el = document.querySelector('[data-k="' + CSS.escape(a.k) + '"]');
  if (el) { el.classList.add("new"); setTimeout(() => el.classList.remove("new"), 20000); }
  setTimeout(() => holo.speak(a.text, voice, !audioOn, () => { busy = false; setTimeout(pump, 1500); }, a.hi), a.hi ? 900 : 500);
}
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : s; return d.innerHTML; }
function renderAlerts(list) {
  const box = document.getElementById("alertList");
  if (!list.length) { box.innerHTML = '<div class="empty">Ingen beskeder det seneste døgn.</div>'; return; }
  box.innerHTML = list.map((a) => '<div class="al' + (a.hi ? " hi" : "") + '" data-k="' + esc(a.k) + '"><div class="m"><span>' + esc(a.when) + "</span><span>" + esc((a.kategori || "").toUpperCase()) + "</span>" + (a.hi ? "<span>HØJ PRIORITET</span>" : "") + '</div><div class="t">' + esc(a.text) + "</div></div>").join("");
}
function renderToday(rows) {
  const box = document.getElementById("todayList");
  const r = rows.filter((x) => x.felt && x["værdi"]);
  document.getElementById("today").style.display = r.length ? "" : "none";
  box.innerHTML = r.map((x) => '<div class="kv"><div class="k">' + esc(x.felt) + '</div><div class="v">' + esc(x["værdi"]) + "</div></div>").join("");
}

let lastOk = 0, failCount = 0, timer = 0;
async function poll() {
  clearTimeout(timer);
  try {
    const [al, td] = await Promise.all([gviz("alerts"), gviz("i_dag")]);
    const now = Date.now();
    const list = al.map((r) => {
      const t = Date.parse(r.tidspunkt || "");
      const exp = r["udløber"] ? Date.parse(r["udløber"]) : NaN;
      return { k: keyOf(r), t, exp, kategori: r.kategori, hi: /^h(ø|o)j/i.test(r.prioritet || ""), text: (r.tekst || "").trim(), when: isNaN(t) ? "" : dm.format(new Date(t)) };
    }).filter((a) => a.text && !isNaN(a.t) && now - a.t < 864e5 && a.t - now < 6e5 && !(a.exp <= now))
      .sort((a, b) => b.t - a.t);
    renderAlerts(list.slice(0, 12));
    renderToday(td);
    for (const a of list.slice().reverse()) {
      if (seen.has(a.k)) continue;
      seen.add(a.k);
      if (firstRun && now - a.t > 15 * 60e3) continue; // første start: læs kun helt nye op
      queue.push(a);
    }
    saveSeen();
    lastOk = now; failCount = 0;
    fdot.classList.remove("off");
    ftxt.textContent = "FEED OPDATERET " + hm.format(new Date(now));
    pump();
  } catch (e) {
    failCount++;
    fdot.classList.add("off");
    ftxt.textContent = "OFFLINE" + (lastOk ? " · SIDST " + hm.format(new Date(lastOk)) : "") + " · PRØVER IGEN";
  }
  const delay = failCount ? Math.min(POLL_SECONDS, 10 * failCount) : POLL_SECONDS;
  timer = setTimeout(poll, delay * 1000);
}
window.addEventListener("online", poll);

const WMO = {0:"Klart",1:"Mest klart",2:"Delvis skyet",3:"Overskyet",45:"Tåge",48:"Rimtåge",51:"Let støvregn",53:"Støvregn",55:"Tæt støvregn",56:"Isslag",57:"Kraftigt isslag",61:"Let regn",63:"Regn",65:"Kraftig regn",66:"Isregn",67:"Kraftig isregn",71:"Let sne",73:"Sne",75:"Kraftig sne",77:"Snefnug",80:"Lette byger",81:"Regnbyger",82:"Kraftige byger",85:"Snebyger",86:"Kraftige snebyger",95:"Torden",96:"Torden med hagl",99:"Kraftig torden med hagl"};
async function loadWeather() {
  try {
    const r = await fetch(WEATHER_URL); if (!r.ok) throw 0;
    const c = (await r.json()).current;
    holo.setWeather({ temp: Math.round(c.temperature_2m) + "°", cond: WMO[c.weather_code] || "Ukendt", wind: c.wind_speed_10m.toFixed(1).replace(".", ",") + " m/s" });
  } catch (e) { /* behold sidste vejr, eller skjul hvis aldrig hentet */ }
}
// keep side panel above subtitles + bottom bar
function layout() { document.documentElement.style.setProperty("--bottom", (innerHeight > innerWidth * 1.1 ? 230 : 200) + "px"); }
addEventListener("resize", layout); layout();
loadWeather(); setInterval(loadWeather, 15 * 60e3);
poll();
// ---- daily refresh at 04:00, soft by default so audio unlock and Wake Lock survive ----
let lastDaily = "";
const dayFmt = new Intl.DateTimeFormat("sv-SE", { timeZone: "Europe/Copenhagen", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hour12: false });
let wallRef = Date.now(), perfRef = performance.now();
function softRefresh() {
  // clear memory: prune seen keys older than 48 h, rebuild lists, re-fetch everything
  const cut = Date.now() - 48 * 3600e3;
  seen = new Set(Array.from(seen).filter((k) => { const t = Date.parse(k.split("|")[0]); return isNaN(t) || t > cut; }));
  saveSeen();
  queue.length = 0;
  document.getElementById("alertList").innerHTML = "";
  document.getElementById("todayList").innerHTML = "";
  holo.stop(); busy = false;
  pickVoice();
  if (unlocked) { ensureAudio(); if (!lock || lock.released) wake(); }
  loadWeather(); poll();
  wallRef = Date.now(); perfRef = performance.now();
  return "soft";
}
function hardReload(reason) {
  try { if (unlocked) sessionStorage.setItem(RESUME_KEY, "1"); } catch (e) {}
  console.log("hard reload:", reason);
  location.reload();
  return "hard";
}
function needsHard() {
  // clock drift between wall time and monotonic time (sleep, suspended tab, bad clock) or heavy memory
  const drift = Math.abs((Date.now() - wallRef) - (performance.now() - perfRef));
  const mem = performance.memory ? performance.memory.usedJSHeapSize : 0;
  return drift > 10 * 60e3 ? "drift " + Math.round(drift / 1000) + "s" : mem > 400e6 ? "memory " + Math.round(mem / 1e6) + "MB" : "";
}
function dailyCheck(now) {
  const parts = dayFmt.format(now || new Date()); // "2026-11-13 04"
  const day = parts.slice(0, 10), hour = parts.slice(-2);
  if (hour !== "04" || day === lastDaily) return "";
  lastDaily = day;
  if (!unlocked) return hardReload("never unlocked");
  const why = needsHard();
  return why ? hardReload(why) : softRefresh();
}
setInterval(() => dailyCheck(), 60e3);
window.__vaeg = { softRefresh, hardReload, dailyCheck, state: () => ({ unlocked, resumed, audio: actx ? actx.state : "none", wake: wlEl.textContent, feed: ftxt.textContent, alerts: document.querySelectorAll(".al").length, hint: hint.style.display !== "none" }) };
</script></body></html>
