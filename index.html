  b.style.display = "block";
  setTimeout(function () {
    say(a.text, function () { HUD.talk(false); setVoice(false); $("bannerMeta").textContent = $("bannerMeta").textContent.replace("TRANSMISSION", "AFSLUTTET"); setTimeout(function () { b.style.display = "none"; busy = false; setTimeout(pump, 1500); }, a.hi ? 25000 : 12000); });
  }, a.hi ? 900 : 500);
}
function renderAlerts(list) {
  var box = $("alertList");
  if (!list.length) { box.innerHTML = '<div class="okbig"><span class="dot"></span>INGEN ALARMER</div><div class="empty" style="margin-top:8px">Intet nyt det seneste døgn, Sir.</div>'; return; }
  box.innerHTML = list.map(function (a) {
    return '<div class="al' + (a.hi ? " hi" : "") + '" data-k="' + esc(a.k) + '"><div class="m">' + esc(a.when) + " · " + esc(a.kategori || "") + (a.hi ? " · HØJ PRIORITET" : "") + '</div><div class="t">' + esc(a.text) + "</div></div>";
  }).join("");
}
var feedOk = 0, failCount = 0, timer = 0;
function poll() {
  clearTimeout(timer);
  Promise.all([gviz("alerts"), gviz("i_dag")]).then(function (res) {
    var al = res[0], td = res[1], now = Date.now();
    var list = al.map(function (r) {
      var t = Date.parse(r.tidspunkt || ""), exp = r["udløber"] ? Date.parse(r["udløber"]) : NaN;
      return { k: keyOf(r), t: t, exp: exp, kategori: r.kategori, hi: /^h(ø|o)j/i.test(r.prioritet || ""), text: (r.tekst || "").trim(), when: isNaN(t) ? "" : fmtWhen(t) };
    }).filter(function (a) { return a.text && !isNaN(a.t) && now - a.t < 864e5 && a.t - now < 6e5 && !(a.exp <= now); })
      .sort(function (a, b) { return b.t - a.t; });
    renderAlerts(list.slice(0, 6));
    sheetToday = td.filter(function (x) { return x.felt && x["værdi"] && !/^eksempel/i.test(x["værdi"]); });
    renderPlan();
    list.slice().reverse().forEach(function (a) {
      if (seen[a.k]) return;
      seen[a.k] = 1;
      if (firstRun && now - a.t > 15 * 60e3) return; // første start: læs kun helt nye op
      queue.push(a);
    });
    saveSeen();
    feedOk = now; failCount = 0; renderStatus();
    pump();
  }).catch(function () { failCount++; renderStatus(); }).then(function () {
    var delay = failCount ? Math.min(POLL_SECONDS, 10 * failCount) : POLL_SECONDS;
    timer = setTimeout(poll, delay * 1000);
  });
}

// ---------- Status ----------
function setVoice(on) { $("vTxt").textContent = on ? "TALER" : "STANDBY"; $("vDot").className = on ? "dot" : "dot warn blink"; }
function renderStatus() {
  var online = navigator.onLine !== false;
  $("netV").innerHTML = online ? '<span class="dot"></span>NETVÆRK: OK' : '<span class="dot off"></span>OFFLINE';
  $("feedV").innerHTML = failCount ? '<span class="dot warn"></span>PRØVER IGEN' + (feedOk ? " · " + hm(new Date(feedOk)) : "")
    : feedOk ? '<span class="dot"></span>OK · ' + hm(new Date(feedOk)) : '<span class="dot warn"></span>FORBINDER';
  $("fdot").className = online && !failCount ? "dot blink" : "dot off";
  $("ftxt").textContent = feedOk ? "FEED OPDATERET " + hm(new Date(feedOk)) : (failCount ? "FEED OFFLINE · PRØVER IGEN" : "FORBINDER…");
  $("wl").textContent = wlText ? wlText.toUpperCase() : "J.A.R.V.I.S";
}
window.addEventListener("online", function () { renderStatus(); poll(); });
window.addEventListener("offline", renderStatus);
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") { if (unlocked) wake(); poll(); } });

// ---------- Skærmvagt: let pixel-skift ----------
function shift() { var x = Math.round(Math.random() * 8 - 4), y = Math.round(Math.random() * 6 - 3); $("wrap").style.transform = "translate(" + x + "px," + y + "px)"; }

// ---------- Opdatering ----------
function hardReload(reason) {
  try { if (unlocked) sessionStorage.setItem(RESUME_KEY, "1"); } catch (e) {}
  if (window.console) console.log("genindlæser:", reason);
  location.reload();
}
function refreshAll() { renderPlan(); renderCountdown(); renderQuote(); renderTrash(); loadData(); poll(); pickVoice(); if (unlocked) { ensureAudio(); if (!lock || lock.released) wake(); } }
function hourly() {
  if ("reload" in params) return hardReload("time");
  // genindlæs kun hvis en ny version er udgivet, så lyd og wake lock bevares
  fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
    var m = /var VERSION = "([^"]+)"/.exec(t);
    if (m && m[1] !== VERSION) hardReload("ny version " + m[1]); else refreshAll();
  }).catch(refreshAll);
}
var lastDay = new Date().getDate(), lastHour = new Date().getHours();
setInterval(function () {
  var d = new Date();
  if (d.getDate() !== lastDay) { lastDay = d.getDate(); refreshAll(); }
  if (d.getHours() !== lastHour) {
    lastHour = d.getHours();
    if (d.getHours() === 4 && !unlocked) return hardReload("dagligt, ikke aktiveret");
    hourly();
  }
}, 1000);

// ---------- Start ----------
tickClock(); setInterval(tickClock, 1000);
renderPlan(); renderCountdown(); renderQuote(); renderTrash(); renderStatus();
loadData(); poll();
setInterval(renderPlan, 5 * 60e3);
setInterval(shift, 2 * 60e3);
window.__vaeg = { version: VERSION, refreshAll: refreshAll, hardReload: hardReload, upcoming: upcoming, isoWeek: isoWeek, state: function () { return { unlocked: unlocked, audio: actx ? actx.state : "none", feedOk: feedOk, alerts: document.querySelectorAll(".al").length }; } };
})();
</script>
</body>
