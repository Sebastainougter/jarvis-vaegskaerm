*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}

.grid{-webkit-box-flex:1;flex:1;display:grid;grid-template-columns:1.25fr 1fr 1fr;grid-template-rows:168px 158px minmax(0,1fr);grid-gap:12px;gap:12px;min-height:0}
.pan{background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:14px 18px;overflow:hidden;min-height:0;position:relative}
.pan h2{margin:0 0 6px;font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
.span2{grid-column:span 2}
/* ur */
#clockPan{display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;justify-content:space-between}
#clock{font-size:132px;line-height:.95;font-weight:200;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#clock .s{font-size:46px;color:var(--dim);font-weight:300;margin-left:6px}
#dateBox{text-align:right}
#wday{font-size:38px;font-weight:600;text-transform:capitalize}
#date{font-size:27px;color:var(--dim);margin-top:4px}
#week{display:inline-block;margin-top:8px;font-size:22px;font-weight:700;color:var(--bg);background:var(--acc);border-radius:10px;padding:4px 12px}
/* vejr nu */
#days{margin-top:6px;border-top:1px solid var(--line);padding-top:2px}
#sun{font-size:20px;color:var(--dim);margin-top:8px}
#sun b{color:var(--txt)}
#nowPan .row{display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center}
#nowIcon{font-size:54px;line-height:1;margin-right:14px}
#nowTemp{font-size:60px;font-weight:300;line-height:1}
#nowDesc{font-size:21px;font-weight:600;margin-top:2px}
#nowMeta{font-size:17px;color:var(--dim);margin-top:6px;line-height:1.4}
#nowMeta b{color:var(--txt);font-weight:600}
/* timer */
#hours{display:-webkit-box;display:flex;justify-content:space-between}
.hr{text-align:center;-webkit-box-flex:1;flex:1}
.hr .t{font-size:18px;color:var(--dim)}
.hr .i{font-size:34px;line-height:1.25}
.hr .v{font-size:26px;font-weight:600}
.hr .p{font-size:16px;color:var(--acc);min-height:20px}
/* 5 dage */
.day{display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;font-size:19px;padding:1px 0;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .n{width:52px;font-weight:700;text-transform:capitalize}
.day .i{width:40px;font-size:22px;text-align:center}
.day .hl{-webkit-box-flex:1;flex:1;text-align:right;font-variant-numeric:tabular-nums}
.day .hl span{color:var(--dim)}
.day .r{width:78px;text-align:right;color:var(--acc);font-size:17px}
/* lister */
.item{display:-webkit-box;display:flex;-webkit-box-align:baseline;align-items:baseline;font-size:21px;line-height:1.25;padding:4px 0}
.item small{color:var(--dim);font-size:16px;margin-left:6px}
.item .tm{min-width:70px;font-weight:700;color:var(--warm);font-variant-numeric:tabular-nums}
.item.done{opacity:.38}
.item.done .tm{text-decoration:line-through}
.sub{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:10px 0 2px}
.cd{display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;font-size:20px;padding:4px 0;border-bottom:1px solid var(--line)}
.cd:last-child{border-bottom:0}
.cd .ic{width:40px;font-size:26px}
.cd .nm{-webkit-box-flex:1;flex:1;line-height:1.2;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .nm small{display:block;font-size:16px;color:var(--dim)}
.cd .dd{font-size:28px;font-weight:700;color:var(--acc);text-align:right;min-width:70px;font-variant-numeric:tabular-nums}
.cd .dd small{display:block;font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.08em;text-transform:uppercase}
.cd.today .dd{color:var(--warm)}
#trash{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
#trash .big{font-size:22px;font-weight:700}
#trash .big .when{color:var(--warm)}
#trash .ty{font-size:18px;color:var(--dim);margin-top:2px}
/* beskeder */
.al{border-left:4px solid var(--acc);padding:6px 0 6px 12px;margin:0 0 9px;border-radius:2px}
.al .m{font-size:14px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.al .t{font-size:21px;line-height:1.3;margin-top:2px}
.al.hi{border-left-color:var(--hot);background:rgba(255,93,74,.08)}
.al.hi .m{color:var(--hot)}
.al.new{background:rgba(54,215,255,.16)}
.empty{font-size:20px;color:var(--dim)}
.okbig{font-size:22px;color:var(--ok);font-weight:600}
/* bund */
#foot{display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;margin-top:10px;min-height:56px}
#quote{-webkit-box-flex:1;flex:1;font-size:21px;line-height:1.3;font-style:italic;color:#d6e2ec;padding-right:18px}
#quote b{font-style:normal;font-weight:600;color:var(--dim);font-size:17px;white-space:nowrap}
#status{font-size:16px;color:var(--dim);text-align:right;line-height:1.5;white-space:nowrap}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle;box-shadow:0 0 8px var(--ok)}
.dot.off{background:var(--hot);box-shadow:0 0 8px var(--hot)}
.dot.warn{background:var(--warm);box-shadow:0 0 8px var(--warm)}
/* alarm-banner */
#banner{position:fixed;left:24px;right:24px;top:20px;z-index:8;background:#0d2735;border:2px solid var(--acc);border-radius:20px;padding:20px 28px;font-size:38px;line-height:1.25;font-weight:600;display:none;box-shadow:0 10px 60px rgba(0,0,0,.7)}
#banner.hi{background:#3a1410;border-color:var(--hot)}
#banner .m{font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
#banner.hi .m{color:var(--hot)}
#unlock{position:fixed;top:0;left:0;right:0;bottom:0;z-index:10;display:-webkit-box;display:flex;-webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;background:rgba(3,5,8,.78);cursor:pointer}
#unlock div{border:2px solid var(--acc);border-radius:20px;padding:28px 44px;font-size:32px;font-weight:600;background:#0c1a24;text-align:center}
#unlock small{display:block;margin-top:10px;font-size:18px;color:var(--dim);font-weight:400}
#hint{position:fixed;z-index:9;right:22px;bottom:74px;display:none;background:#0c1a24;color:var(--txt);border:1px solid var(--acc);border-radius:10px;padding:8px 14px;font:600 16px -apple-system,Helvetica,Arial,sans-serif;cursor:pointer}
</style>
</head>

  items.forEach(function (it) {
    var done = it.tm && (parseInt(it.tm, 10) * 60 + parseInt(it.tm.slice(3), 10)) < nowM - 30;
    html += '<div class="item' + (done ? " done" : "") + '"><span class="tm">' + esc(it.tm) + "</span><span>" + esc(it.txt) + (it.who ? "<small>" + esc(it.who) + "</small>" : "") + "</span></div>";
  });
  sheetToday.forEach(function (r) { html += '<div class="item"><span class="tm">•</span><span><b>' + esc(r.felt) + ":</b> " + esc(r["værdi"]) + "</span></div>"; });
  if (now.getHours() >= 16) {
    var tm = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    html += '<div class="sub">I morgen, ' + DAGE[tm.getDay()] + "</div>";
    planFor(tm).forEach(function (it) { html += '<div class="item"><span class="tm">' + esc(it.tm) + "</span><span>" + esc(it.txt) + (it.who ? "<small>" + esc(it.who) + "</small>" : "") + "</span></div>"; });
  }
  $("plan").innerHTML = html;
}

// ---------- Nedtælling ----------
var extraEvents = [];
function upcoming() {
  var today = midnight(new Date()), out = [];
  BIRTHDAYS.forEach(function (b) {
    var y = today.getFullYear(), d = new Date(y, b[2] - 1, b[1]);
    if (d < today) { y++; d = new Date(y, b[2] - 1, b[1]); }
    var age = y - b[3];
    if (age < 1) return;
    out.push({ ic: "🎂", navn: b[0], note: "fylder " + age + " · " + d.getDate() + ". " + MDR[d.getMonth()], date: d });
  });
  EVENTS.concat(extraEvents).forEach(function (e) {
    var s, en;
    if (e.aarlig) { s = new Date(today.getFullYear(), e.m - 1, e.d); if (s < today) s = new Date(today.getFullYear() + 1, e.m - 1, e.d); en = s; }
    else {
      s = e.start ? new Date(e.start[0], e.start[1] - 1, e.start[2]) : parseLocal(e.dato);
      en = e.slut ? (e.slut.length ? (typeof e.slut === "string" ? parseLocal(e.slut) : new Date(e.slut[0], e.slut[1] - 1, e.slut[2])) : s) : s;
      if (!s || en < today) return;
    }
    var running = s <= today && en >= today && en > s;
    out.push({ ic: e.ikon || "📅", navn: e.navn, note: running ? "I gang, dag " + (dayDiff(s, today) + 1) + " af " + (dayDiff(s, en) + 1) : (e.note || (s.getDate() + ". " + MDR[s.getMonth()])), date: running ? today : s, running: running });
  });
  out.sort(function (a, b) { return a.date - b.date; });
  return out.slice(0, 5);
}
function renderCountdown() {
  var today = new Date();
  $("countdown").innerHTML = upcoming().map(function (e) {
    var n = dayDiff(today, e.date);
    var dd = e.running ? "NU<small>i gang</small>" : n === 0 ? "🎉<small>i dag</small>" : n === 1 ? "1<small>dag</small>" : n + "<small>dage</small>";
    return '<div class="cd' + (n === 0 ? " today" : "") + '"><div class="ic">' + e.ic + '</div><div class="nm">' + esc(e.navn) + "<small>" + esc(e.note) + '</small></div><div class="dd">' + dd + "</div></div>";
  }).join("");
}

// ---------- Affald (data.json) ----------
var affald = [];
function loadData() {
  return fetch("data.json?_=" + Date.now(), { cache: "no-store" }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (j) {
    affald = (j.affald || []).filter(function (a) { return parseLocal(a.dato); });
    extraEvents = (j.ekstra_begivenheder || []).filter(function (e) { return e && e.navn && e.dato; });
    renderTrash(); renderCountdown();
  }).catch(function () { renderTrash(); });
}
function renderTrash() {
  var today = midnight(new Date());
  var next = affald.map(function (a) { return { d: parseLocal(a.dato), t: a.typer || [] }; }).filter(function (a) { return a.d >= today; }).sort(function (a, b) { return a.d - b.d; })[0];
  if (!next) { $("trash").innerHTML = '<div class="sub">Affald</div><div class="ty">Ingen kendt dato for næste afhentning</div>'; return; }
  var n = dayDiff(today, next.d);
  $("trash").innerHTML = '<div class="sub">🗑️ Næste affald</div><div class="big">' + DAGE[next.d.getDay()] + " " + next.d.getDate() + ". " + MDR[next.d.getMonth()] +
    ' <span class="when">(' + dageTekst(n) + ")</span></div>" + '<div class="ty">' + next.t.map(esc).join(" · ") + (n === 1 ? "<br>Husk at stille spandene ud i aften" : "") + "</div>";
}

// ---------- Citat ----------
function renderQuote() {
  var d = new Date(), idx = (Math.floor(midnight(d) / 864e5) + 0) % QUOTES.length;
  var q = QUOTES[idx];
  $("quote").innerHTML = "“" + esc(q[0]) + "” <b>· " + esc(q[1]) + "</b>";
}

// ---------- Beskeder fra Google Sheet (JSONP, virker uden CORS) ----------
var cbN = 0;
function gviz(sheet) {
  return new Promise(function (resolve, reject) {
    var name = "__feed" + (++cbN), s = document.createElement("script");
    var to = setTimeout(function () { cleanup(); reject(new Error("timeout")); }, 15000);
    function cleanup() { clearTimeout(to); try { delete window[name]; } catch (e) { window[name] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
    window[name] = function (resp) {
      cleanup();
      if (!resp || resp.status === "error" || !resp.table) return reject(new Error("feed"));
      var cols = resp.table.cols.map(function (c) { return String(c.label || c.id || "").trim().toLowerCase(); });
      resolve((resp.table.rows || []).map(function (r) {
        var o = {};
        cols.forEach(function (k, i) { var c = r.c && r.c[i]; o[k] = c ? (c.f != null && typeof c.v !== "string" ? c.f : c.v) : null; if (o[k] != null) o[k] = String(o[k]).trim(); });
        return o;
      }));
    };
    s.onerror = function () { cleanup(); reject(new Error("net")); };
    s.src = FEED_BASE + "?tqx=out:json;responseHandler:" + name + "&headers=1&sheet=" + encodeURIComponent(sheet) + "&_=" + Date.now();
    document.head.appendChild(s);
  });
}

// ---------- Lyd og stemme ----------
var audioOn = false, actx = null, voice = null, unlocked = false, resumed = false;
function pickVoice() {
  if (!window.speechSynthesis) return;
  var vs = speechSynthesis.getVoices();
  function sc(v) { var n = (v.name + " " + v.lang).toLowerCase(), s = 0, l = v.lang.toLowerCase().replace("_", "-"); if (l.indexOf("da") === 0) s += 100; if (l === "en-gb") s += 50; if (/daniel|arthur|george|oliver|male|magnus/.test(n)) s += 20; return s; }
  voice = vs.slice().sort(function (a, b) { return sc(b) - sc(a); })[0] || null;
}
if (window.speechSynthesis) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function ensureAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state !== "running") actx.resume(); } catch (e) { actx = null; } }
function chime(hi) {
  if (!actx) return;
  var t = actx.currentTime, notes = hi ? [880, 660, 880] : [740, 988];
  notes.forEach(function (f, i) {
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = "sine"; o.frequency.value = f;
    g.gain.setValueAtTime(0, t + i * 0.18);
    g.gain.linearRampToValueAtTime(hi ? 0.18 : 0.08, t + i * 0.18 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.18 + 0.9);
    o.connect(g); g.connect(actx.destination); o.start(t + i * 0.18); o.stop(t + i * 0.18 + 1);
  });
}
function say(text, cb) {
  var done = false, wd = 0;
  function fin() { if (done) return; done = true; clearTimeout(wd); cb(); }
  wd = setTimeout(fin, 4000 + text.length * 90);
  if (!audioOn || !window.speechSynthesis || typeof SpeechSynthesisUtterance === "undefined") return;
  try {
    var u = new SpeechSynthesisUtterance(text);
    if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = "da-DK";
    u.rate = 0.98; u.pitch = 0.92;
    u.onend = fin; u.onerror = fin;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
    if (speechSynthesis.paused) speechSynthesis.resume();
  } catch (e) { }
}

// ---------- Wake lock ----------
var lock = null, wlText = "";
function wake() {
  try {
    if ("wakeLock" in navigator) {
      navigator.wakeLock.request("screen").then(function (l) { lock = l; wlText = "Skærm holdes tændt"; renderStatus(); l.addEventListener("release", function () { wlText = ""; renderStatus(); }); })
        .catch(function () { wlText = "Slå auto-lås fra på iPad"; renderStatus(); });
    } else { wlText = "Slå auto-lås fra på iPad"; renderStatus(); }
  } catch (e) { wlText = "Slå auto-lås fra på iPad"; }
}

// ---------- Aktivering af lyd ----------
try { resumed = sessionStorage.getItem(RESUME_KEY) === "1"; sessionStorage.removeItem(RESUME_KEY); } catch (e) {}
var overlay = $("unlock"), hint = $("hint");
function unlockAudio(fromGesture) {
  ensureAudio();
  if (fromGesture) { try { if (window.speechSynthesis) { var u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {} }
  audioOn = !("mute" in params);
  unlocked = true;
  wake();
}
function updateHint() { hint.style.display = (unlocked && actx && actx.state === "running") ? "none" : (resumed ? "block" : "none"); }
overlay.addEventListener("click", function () {
  unlockAudio(true);
  var el = document.documentElement;
  try { if (el.requestFullscreen && !document.fullscreenElement) { var pr = el.requestFullscreen(); if (pr && pr.catch) pr.catch(function () {}); } } catch (e) {}
  if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
  pump();
});
if (resumed) {
  if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
  unlockAudio(false);
  setTimeout(updateHint, 800);
  var onAny = function () { unlockAudio(true); setTimeout(updateHint, 300); if (actx && actx.state === "running") document.removeEventListener("pointerdown", onAny, true); };
  document.addEventListener("pointerdown", onAny, true);
}
hint.addEventListener("click", function (e) { e.stopPropagation(); unlockAudio(true); setTimeout(updateHint, 300); });

// ---------- Alarmer ----------
var seen = {};
try { JSON.parse(localStorage.getItem(SEEN_KEY) || "[]").forEach(function (k) { seen[k] = 1; }); } catch (e) {}
var firstRun = Object.keys(seen).length === 0;
function saveSeen() { try { localStorage.setItem(SEEN_KEY, JSON.stringify(Object.keys(seen).slice(-500))); } catch (e) {} }
function keyOf(a) { return (a.tidspunkt || "") + "|" + (a.tekst || ""); }
var queue = [], busy = false;
function fmtWhen(t) { var d = new Date(t); return d.getDate() + ". " + MDR[d.getMonth()].slice(0, 3) + " " + hm(d); }
function pump() {
  if (busy || !queue.length || (!unlocked && document.getElementById("unlock"))) return;
  queue.sort(function (a, b) { return (b.hi ? 1 : 0) - (a.hi ? 1 : 0); });
  var a = queue.shift();
  busy = true;
  chime(a.hi);
  var els = document.querySelectorAll(".al"), el = null;
  for (var i = 0; i < els.length; i++) if (els[i].getAttribute("data-k") === a.k) el = els[i];
  if (el) { el.className += " new"; setTimeout(function () { el.className = el.className.replace(" new", ""); }, 20000); }
  var b = $("banner");
  b.className = a.hi ? "hi" : "";
  $("bannerMeta").textContent = (a.hi ? "⚠️ Høj prioritet · " : "🔔 ") + (a.kategori || "Besked") + " · " + a.when;
  $("bannerText").textContent = a.text;
  b.style.display = "block";
  setTimeout(function () {
    say(a.text, function () { setTimeout(function () { b.style.display = "none"; busy = false; setTimeout(pump, 1500); }, a.hi ? 25000 : 12000); });
  }, a.hi ? 900 : 500);
}
function renderAlerts(list) {
  var box = $("alertList");
  if (!list.length) { box.innerHTML = '<div class="okbig">✓ Ingen alarmer</div><div class="empty" style="margin-top:6px">Intet nyt det seneste døgn.</div>'; return; }
  box.innerHTML = list.map(function (a) {
    return '<div class="al' + (a.hi ? " hi" : "") + '" data-k="' + esc(a.k) + '"><div class="m">' + esc(a.when) + " · " + esc(a.kategori || "") + (a.hi ? " · høj prioritet" : "") + '</div><div class="t">' + esc(a.text) + "</div></div>";
  }).join("");
}
var feedOk = 0, failCount = 0, timer = 0;
function poll() {
  clearTimeout(timer);
  Promise.all([gviz("alerts"), gviz("i_dag")]).then(function (res) {
    var al = res[0], td = res[1], now = Date.now();
    var list = al.map(function (r) {
      var t = Date.parse(r.tidspunkt || ""), exp = r["udløber"] ? Date.parse(r["udløber"]) : NaN;
      return { k: keyOf(r), t: t, exp: exp, kategori: r.kategori, hi: /^h(ø|o)j/i.test(r.prioritet || ""), text: (r.tekst || "").trim(), when: isNaN(t) ? "" : fmtWhen(t) };
    }).filter(function (a) { return a.text && !isNaN(a.t) && now - a.t < 864e5 && a.t - now < 6e5 && !(a.exp <= now); })
      .sort(function (a, b) { return b.t - a.t; });
    renderAlerts(list.slice(0, 6));
    sheetToday = td.filter(function (x) { return x.felt && x["værdi"] && !/^eksempel/i.test(x["værdi"]); });
    renderPlan();
    list.slice().reverse().forEach(function (a) {
      if (seen[a.k]) return;
      seen[a.k] = 1;
      if (firstRun && now - a.t > 15 * 60e3) return; // første start: læs kun helt nye op
      queue.push(a);
    });
    saveSeen();
    feedOk = now; failCount = 0; renderStatus();
    pump();
  }).catch(function () { failCount++; renderStatus(); }).then(function () {
    var delay = failCount ? Math.min(POLL_SECONDS, 10 * failCount) : POLL_SECONDS;
    timer = setTimeout(poll, delay * 1000);
  });
}

// ---------- Status ----------
function renderStatus() {
  var online = navigator.onLine !== false && !weatherFail;
  var net = online ? '<span class="dot"></span>Netværk: OK' : '<span class="dot off"></span>Netværk: offline';
  var feed = failCount ? '<span class="dot warn"></span>Beskeder: prøver igen' + (feedOk ? " (sidst " + hm(new Date(feedOk)) + ")" : "")
    : feedOk ? '<span class="dot"></span>Beskeder ' + hm(new Date(feedOk)) : '<span class="dot warn"></span>Beskeder: forbinder';
  var w = weatherOk ? " · vejr " + hm(new Date(weatherOk)) : "";
  $("status").innerHTML = net + " &nbsp; " + feed + "<br>" + esc(wlText) + w;
}
window.addEventListener("online", function () { renderStatus(); poll(); loadWeather(); });
window.addEventListener("offline", renderStatus);
document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") { if (unlocked) wake(); poll(); loadWeather(); } });

// ---------- Skærmvagt: let pixel-skift ----------
function shift() { var x = Math.round(Math.random() * 8 - 4), y = Math.round(Math.random() * 6 - 3); $("wrap").style.transform = "translate(" + x + "px," + y + "px)"; }

// ---------- Opdatering ----------
function hardReload(reason) {
  try { if (unlocked) sessionStorage.setItem(RESUME_KEY, "1"); } catch (e) {}
  if (window.console) console.log("genindlæser:", reason);
  location.reload();
}
function refreshAll() { renderPlan(); renderCountdown(); renderQuote(); renderTrash(); loadData(); loadWeather(); poll(); pickVoice(); if (unlocked) { ensureAudio(); if (!lock || lock.released) wake(); } }
function hourly() {
  if ("reload" in params) return hardReload("time");
  // genindlæs kun hvis en ny version er udgivet, så lyd og wake lock bevares
  fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.text(); }).then(function (t) {
    var m = /var VERSION = "([^"]+)"/.exec(t);
    if (m && m[1] !== VERSION) hardReload("ny version " + m[1]); else refreshAll();
  }).catch(refreshAll);
}
var lastDay = new Date().getDate(), lastHour = new Date().getHours();
setInterval(function () {
  var d = new Date();
  if (d.getDate() !== lastDay) { lastDay = d.getDate(); refreshAll(); }
  if (d.getHours() !== lastHour) {
    lastHour = d.getHours();
    if (d.getHours() === 4 && !unlocked) return hardReload("dagligt, ikke aktiveret");
    hourly();
  }
}, 1000);

// ---------- Start ----------
tickClock(); setInterval(tickClock, 1000);
renderPlan(); renderCountdown(); renderQuote(); renderTrash(); renderStatus();
loadData(); loadWeather(); poll();
setInterval(loadWeather, 15 * 60e3);
setInterval(renderPlan, 5 * 60e3);
setInterval(shift, 2 * 60e3);
window.__vaeg = { version: VERSION, refreshAll: refreshAll, hardReload: hardReload, upcoming: upcoming, isoWeek: isoWeek, state: function () { return { unlocked: unlocked, audio: actx ? actx.state : "none", feedOk: feedOk, weatherOk: weatherOk, alerts: document.querySelectorAll(".al").length }; } };
})();
</script>
